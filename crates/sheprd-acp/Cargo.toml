[package]
description            = "Runs an ACP agent in a terminal pane and shares its conversation with Sheprd"
edition.workspace      = true
license.workspace      = true
name                   = "sheprd-acp"
publish.workspace      = true
rust-version.workspace = true
version.workspace      = true

[lints]
workspace = true

[dependencies]
acp.workspace                 = true
anyhow.workspace              = true
base64.workspace              = true
chrono.workspace              = true
crossbeam-channel.workspace   = true
crossterm.workspace           = true
sheprd-backend = { optional = true, workspace = true }
sheprd-chat-protocol.workspace = true
sheprd-client.workspace        = true
sheprd-mcp.workspace           = true
sheprd-memory.workspace        = true
sheprd-core-client.workspace   = true
sheprd-t3.workspace            = true
sheprd-tmux = { optional = true, workspace = true }
sheprd-traces.workspace        = true
ratatui.workspace             = true
serde.workspace               = true
serde_json.workspace          = true
sha2.workspace                = true
thiserror.workspace           = true
unicode-width.workspace       = true
url.workspace                 = true
uuid.workspace                = true

[dev-dependencies]
tempfile.workspace    = true
tungstenite.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
sysinfo.workspace = true

[features]
tmux = ["dep:sheprd-tmux", "dep:sheprd-backend"]
