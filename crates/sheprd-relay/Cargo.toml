[package]
description            = "Joins two peers' end-to-end encrypted streams when no direct path exists, seeing only ciphertext"
edition.workspace      = true
license.workspace      = true
name                   = "sheprd-relay"
publish.workspace      = true
rust-version.workspace = true
version.workspace      = true

[lints]
workspace = true

[features]
# The relay service and its binary. Clients depend on this crate without
# it, for relay endpoints, routes, proofs, and framing alone.
default = ["server"]
# Reaching a relay over QUIC as a listener or a dialer (`client`), its
# `/v1/info` read with ureq; no axum or server limits.
client = ["dep:quinn", "dep:rustls", "dep:tokio", "dep:ureq"]
# Reaching a relay over its WebSocket API as a listener or a dialer
# (`client_ws`): TLS with the platform's verifier, Tokio only.
client-ws = [
  "dep:futures-util",
  "dep:rustls",
  "dep:rustls-platform-verifier",
  "dep:tokio",
  "dep:tokio-rustls",
  "dep:tokio-tungstenite",
]
# The operator's read-only dashboard at /dashboard.
dashboard = ["websocket-server"]
# What a relay keeps for its operator (`ops`): rate limits, secrets,
# Prometheus text, and the dashboard kit other services can build on.
ops = [
  "dep:axum",
  "dep:futures-util",
  "dep:hmac",
  "dep:percent-encoding",
  "dep:tokio",
  "dep:tracing",
]
# The QUIC transport beside the WebSocket one.
quic-server = ["dep:quinn", "dep:rcgen", "dep:rustls", "websocket-server"]
# The whole relay as it is deployed: both transports, the dashboard,
# /metrics, settings, and the binary.
server = [
  "dashboard",
  "dep:secrecy",
  "dep:tracing-subscriber",
  "quic-server",
  "websocket-server",
]
# A relay to run inside other projects' tests (`testing`): WebSockets on a
# loopback port, small limits, no bans, no dashboard, QUIC, or metrics port.
testing = ["websocket-server"]
# The relay itself over WebSockets: who listens, limits, bans, splicing.
websocket-server = ["dep:axum", "dep:futures-util", "dep:tokio", "dep:tracing", "ops"]

[[bin]]
name              = "sheprd-relay"
required-features = ["server"]

[[example]]
name              = "echo_computer"
required-features = ["client", "server"]

[dependencies]
base64.workspace     = true
getrandom.workspace  = true
p256.workspace       = true
serde.workspace      = true
serde_json.workspace = true
sha2.workspace       = true
thiserror.workspace  = true
url.workspace        = true

axum          = { optional = true, workspace = true }
# `split` lets each direction of a spliced pair wait on its own throttle.
futures-util             = { features = ["std"], optional = true, workspace = true }
hmac                     = { optional = true, workspace = true }
percent-encoding         = { optional = true, workspace = true }
quinn                    = { optional = true, workspace = true }
rcgen                    = { optional = true, workspace = true }
rustls                   = { optional = true, workspace = true }
rustls-platform-verifier = { optional = true, workspace = true }
secrecy                  = { optional = true, workspace = true }
tokio                    = { optional = true, workspace = true }
tokio-rustls             = { optional = true, workspace = true }
tokio-tungstenite        = { optional = true, workspace = true }
tracing                  = { optional = true, workspace = true }
tracing-subscriber       = { features = ["fmt"], optional = true, workspace = true }
ureq                     = { optional = true, workspace = true }

[dev-dependencies]
anyhow.workspace            = true
sheprd-tunnel               = { features = ["tokio"], path = "../sheprd-tunnel" }
http-body-util.workspace    = true
serde_json.workspace        = true
tokio                       = { features = ["test-util"], workspace = true }
tokio-tungstenite.workspace = true
tower.workspace             = true
