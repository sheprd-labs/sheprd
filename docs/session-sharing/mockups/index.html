0b6;display:block;margin-top:4px}.demo{padding:12px 0 0;font-size:10px;color:#a296ae}.demo select{width:100%;padding:8px;margin-top:8px;border:1px solid #e2dbe9;background:#fbfafd;border-radius:6px;color:#95839e;font-size:11px}.sharedcard{padding:13px 11px;background:#e0dceb;border-radius:8px;margin-top:8px}.sharedcard .title{font-size:12px;font-weight:600;color:#6f607f;margin:8px 0}.sharedcard .meta{display:flex;justify-content:space-between;font-size:10px;color:#9b8ca8}.sharedcard .owner{font-size:10px;color:#94829e;display:flex;align-items:center;gap:6px}.sharedcard .avatar{width:19px;height:19px;font-size:8px}.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);padding:13px 23px;background:#343044;color:white;border-radius:9px;box-shadow:var(--shadow);z-index:20;font-size:12px}.previewnotice{background:#f0e8f3;padding:12px 25px;text-align:center;color:#96769f;font-size:11px}.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px}.empty .bigicon{font-size:36px;color:#b4a7c2;margin-bottom:20px}.empty h2{font-size:20px;color:#7f6a90}.empty p{font-size:12px;line-height:1.8;color:#a090ac;max-width:330px}.comment{padding:13px 16px;background:#f2edf7;border:1px solid #e4dbed;border-radius:9px;margin:16px 0 0 32px;font-size:12px;color:#947ea2;line-height:1.6}.comment small{display:block;font-size:9px;color:#b09db9;margin-top:7px}@media(min-width:1650px){.frame{max-width:1600px;margin-left:auto;margin-right:auto}}@media(max-width:1050px){.webaside{width:210px;padding:23px 16px}.sidebar{width:190px}.conversation{padding:25px}.prototype{padding:0 20px;gap:15px}.prototype small{display:none}}@media(max-width:750px){.sidebar,.rail,.webaside{display:none}.frame{margin:0 10px 15px}.intro{padding:0 16px}.intro .step{display:none}.prototype{gap:8px;padding:0 12px}.brand{display:none}.tabs button{font-size:11px;padding:9px}.chrome .address{padding:6px 12px}.sessionhead{padding:0 15px}.watching{display:none}.modal{width:94%;padding:22px}.conversation{padding:24px 16px}.webtop{padding:0 16px}.webtop .private{display:none}.composearea{padding:12px 16px}.intro h1{font-size:19px}}
</style></head><body>
<nav class="prototype"><div class="brand">Sheprd <span>/ sharing</span></div><div class="tabs"><button data-screen="share" class="active"><b>01</b> Share a session</button><button data-screen="web"><b>02</b> Open on the web</button><button data-screen="app"><b>03</b> Open in Sheprd</button></div><small>Interactive concept · fictional data</small></nav>
<div class="intro"><div><h1 id="heading"></h1><p id="description"></p></div><span class="step" id="step"></span></div><div class="frame" id="frame"></div><div class="toast hidden" id="toast" role="status"></div>
<script>
const state={screen:'share',role:'View',audience:'Anyone with the link',history:'Entire conversation',expiry:'1 hour',relay:'Default relays',created:false,preview:false,webrole:'Viewer',availability:'Live',comments:[]};
const $=s=>document.querySelector(s);
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function toast(s){$('#toast').textContent=s;$('#toast').classList.remove('hidden');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('#toast').classList.add('hidden'),3200)}
function select(name,options,value){return `<select aria-label="${name}" data-setting="${name}">${options.map(x=>`<option ${x===value?'selected':''}>${x}</option>`).join('')}</select>`}
function chrome(web=false){return `<div class="chrome"><div class="lights"><i></i><i></i><i></i></div>${web?'<div class="address">♧ &nbsp; share.sheprd.example / s / 7k9m</div>':'<span class="tabname">◎ &nbsp; Codex <span style="color:#79a989">○</span></span>'}<span class="right">${web?'↗':'＋ &nbsp; ◫'}</span></div>`}
function sidebar(shared=false){return `<div class="rail"><button class="${shared?'':'sel'}" aria-label="Workspaces">▣</button><button aria-label="Activity">⌁</button><button class="${shared?'sel':''}" aria-label="Shared sessions">♧</button><button aria-label="Pull requests">⑂</button><button class="bottom" aria-label="Settings">⚙</button></div><aside class="sidebar"><div class="eyebrow">${shared?'Shared with me':'Workspaces'}</div>${shared?`<div class="tree">⌕ &nbsp; Find a shared session</div><div class="section">Live sessions <span style="float:right">1</span></div><div class="sharedcard"><div class="owner"><span class="avatar">FP</span> François Penso</div><div class="title">Fix session reconnects</div><div class="meta"><span>◎ Codex · <i class="dot"></i> Idle</span><span>${state.webrole}</span></div></div><div class="section">Earlier</div><div class="tree">◷ &nbsp; Review the onboarding flow</div><div class="tree" style="font-size:10px;margin-left:20px">Maya Chen · Ended yesterday</div><div class="person"><span>Shared sessions run on their owner's machine. Your files stay here.</span></div>`:`<div class="section">spaces</div><div class="tree">⌄ &nbsp; sheprd <span class="count">12</span></div><div class="tree">&nbsp; ⑂ &nbsp; feat / reconnect</div><div class="tree active">&nbsp; <i class="dot"></i> &nbsp; shareable sessions</div><div class="tree">&nbsp; ⑂ &nbsp; moonframe</div><div class="tree">&nbsp; ⑂ &nbsp; t3-steer</div><div class="section">agents</div><div class="tree active">◎ &nbsp; Codex <span class="count">idle</span></div><div class="tree">✳ &nbsp; Claude <span class="count">working</span></div><div class="person"><span class="avatar">FP</span> François Penso <i class="dot"></i></div>`}</aside>`}
function transcript(){return `<div class="transcript"><div class="day">Today · Shared from 10:42 AM</div>${state.history==='From this point'&&state.preview?'<div class="readonly">Earlier conversation is not shared</div>':`<div class="message"><div class="author"><span class="avatar">FP</span> François <span class="pill">Owner</span><time>10:42</time></div><div class="bubble">Can you fix the session reconnect issue? When my laptop wakes up, I sometimes see the last message twice.</div></div>`}<div class="message"><div class="author"><span class="avatar green">◎</span> Codex <time>10:43</time></div><div class="answer"><p>I found the cause. After reconnecting, the client was applying a replayed message before checking its cursor.</p><div class="tool"><span>⌕</span><span>Read <span class="code">session/stream.rs</span></span><span>✓</span></div><p>I moved the cursor check ahead of the update and added a regression test for reconnecting after sleep.</p><div class="artifact"><div class="artifacthead"><span>⑂ &nbsp; session/stream.rs</span><span>+3 −1 &nbsp; · &nbsp; Shared excerpt</span></div><div class="diff">+ if update.cursor &lt;= self.cursor {<br>+ &nbsp;&nbsp; return Ok(());<br>+ }</div></div><div class="result">✓ &nbsp; Reconnect regression test passed <span style="color:#b7aabc">·</span> 3 tests passed</div><p>The conversation now resumes without repeating the last message.</p></div></div>${state.comments.map(c=>`<div class="comment"><strong>Maya · Comment</strong><br>${esc(c)}<small>Visible to participants · Not sent to Codex</small></div>`).join('')}</div>`}
function compose(owner=false){if(owner)return `<div class="composearea"><div class="composer"><textarea aria-label="Owner prompt" placeholder="Ask Codex anything…"></textarea><div class="composerfoot">＋ &nbsp; ◎ Codex &nbsp; ◇ High &nbsp; ♧ Full access <span class="pill">Auto-accepting</span><button class="send" data-action="owner-send" aria-label="Send">↑</button></div></div></div>`;if(state.webrole==='Viewer')return `<div class="composearea"><div class="readonly">♧ &nbsp; You have view-only access <button data-action="request">Request comment access</button></div><div class="footnote">Runs on François’s Mac Studio · No access to your computer</div></div>`;return `<div class="composearea"><div class="composer"><textarea id="guest-text" aria-label="${state.webrole==='Commenter'?'Comment':'Suggested prompt'}" placeholder="${state.webrole==='Commenter'?'Leave a comment for the people in this session…':'Suggest a prompt for Codex…'}"></textarea><div class="composerfoot">${state.webrole==='Commenter'?'♧ Comments are not sent to the agent':'♧ François must approve before the agent runs'}<button class="send" data-action="guest-send" aria-label="Send suggestion or comment">↑</button></div></div><div class="footnote">${state.webrole==='Commenter'?'Discuss the work without changing what the agent does.':'Supervised collaboration · Runs on the owner’s machine and account'}</div></div>`}
function session(owner=false){return `<main class="main"><header class="sessionhead"><span class="agentmark">◎</span><div><div class="sessiontitle">Fix session reconnects</div><div class="subtitle">Codex <span style="color:#75a286">●</span> Idle ${owner?'':'· Shared by François'}</div></div><span class="spacer"></span><div class="watching"><span class="avatar">FP</span><span class="avatar pink">MC</span>2 watching</div>${owner?'<button class="sharebtn secondary" data-action="open-share">↗ &nbsp; Share</button>':`<span class="pill">${state.webrole}</span>`}</header>${!owner?`<div class="banner">♧ <strong>${state.screen==='app'?'Shared session':'Private link'}</strong><span>· ${state.webrole==='Collaborator'?'Owner approval required for prompts':'Only this conversation is shared'}</span><a data-action="access">Access details ↗</a></div>`:''}<div class="conversation">${transcript()}</div>${compose(owner)}</main>`}
function modal(){return `<div class="shade"><section class="modal" role="dialog" aria-modal="true" aria-label="Share this session"><div class="modaltop"><h2>Share this session</h2><button data-action="close-share" aria-label="Close share dialog">×</button></div><p class="desc">Invite someone to follow along or help out.<br>The agent keeps running on your machine.</p><span class="label">What can they do?</span><div class="roles">${['View','Comment','Collaborate'].map(r=>`<button class="${state.role===r?'on':''}" data-role="${r}">${r}</button>`).join('')}</div><div class="hint">${state.role==='View'?'Read the conversation and shared artifacts. No agent controls.':state.role==='Comment'?'Leave comments for participants. Comments are not sent to the agent.':'Suggest prompts for you to approve. Tool approvals and agent settings stay with you.'}</div><div class="fields"><div class="field"><label class="label">Who can join?</label>${select('audience',['Anyone with the link','People I approve'],state.audience)}</div><div class="field"><label class="label">Link expires in</label>${select('expiry',['1 hour','1 day','Until revoked'],state.expiry)}</div></div><div class="field"><label class="label">Conversation history</label>${select('history',['Entire conversation','From this point'],state.history)}</div><div class="preview"><span class="icon">▤</span><div><strong>See exactly what you’re sharing</strong><p>Includes messages, tool output, and shared excerpts.</p></div><button data-action="preview">Preview ↗</button></div><div class="advanced"><span>Connection</span>${select('relay',['Default relays','My private relay'],state.relay)}</div>${state.created?`<div class="success">✓ Demo invitation created · ${state.role.toLowerCase()} access<input readonly aria-label="Demo invitation link" value="https://share.sheprd.example/s/7k9m#demo-invite"><button data-action="revoke">Revoke this invitation</button></div>`:''}<div class="linkrow"><button class="primary" data-action="create">${state.created?'Copy demo link':'Create invitation link'} &nbsp; ↗</button></div><div class="privacy">${state.audience==='Anyone with the link'?'Anyone you forward the link to can join.':'Guests wait for you to approve their request.'}<br>You can stop future access at any time.</div></section></div>`}
function aside(){return `<aside class="webaside"><div class="eyebrow">About this session</div><h3>A second pair of eyes.</h3><p>Follow the work as it happens. The agent and files stay on the owner’s machine.</p><div class="stat"><span>Agent</span><b>Codex</b></div><div class="stat"><span>Connection</span><b>Encrypted</b></div><div class="stat"><span>Link expires</span><b>In 58 minutes</b></div><div class="divider"></div><h3>In this session</h3><div class="asideperson"><span class="avatar">FP</span><div>François Penso<small>Owner · Mac Studio</small></div><i class="dot"></i></div><div class="asideperson"><span class="avatar pink">MC</span><div>Maya Chen <small>You · ${state.webrole}</small></div></div><div class="divider"></div><p>Opening in Sheprd gives you the same access in a native window.</p><button class="secondary" style="font-size:11px;width:100%" data-action="native">Open in Sheprd ↗</button><div class="divider"></div><div class="demo">PROTOTYPE CONTROLS${select('webrole',['Viewer','Commenter','Collaborator'],state.webrole)}${select('availability',['Live','Waiting for approval','Host offline','Access revoked'],state.availability)}</div></aside>`}
function empty(){const texts={'Waiting for approval':['♧','Your request is with François','You’ll join as soon as the owner approves. No conversation has been shared with you yet.'],'Host offline':['◷','François’s Mac is offline','This live session will reconnect when the host returns. Your access has not changed.'],'Access revoked':['⊘','This invitation has ended','The owner has stopped sharing this session. Ask them for a new invitation to join again.']};const t=texts[state.availability];return `<main class="main"><div class="empty"><div class="bigicon">${t[0]}</div><h2>${t[1]}</h2><p>${t[2]}</p><button class="secondary" data-action="live">Back to live preview</button></div></main>`}
function render(){const info={share:['A conversation, with an invitation.','Choose what guests can do and preview what leaves your machine.','01 / OWNER EXPERIENCE'],web:['One link. The whole conversation.','A focused browser view for someone who doesn’t have Sheprd.','02 / BROWSER EXPERIENCE'],app:['Shared with you. Right where you work.','The same live session, with the same permissions, inside Sheprd.','03 / NATIVE EXPERIENCE']}[state.screen];$('#heading').textContent=info[0];$('#description').textContent=info[1];$('#step').textContent=info[2];document.querySelectorAll('[data-screen]').forEach(b=>b.classList.toggle('active',b.dataset.screen===state.screen));if(state.screen==='web')$('#frame').innerHTML=chrome(true)+`<div class="webtop"><span class="webbrand">✳ sheprd</span><span class="private">Shared sessions</span><span class="spacer"></span><button class="secondary" data-action="native">Open in Sheprd ↗</button><span class="avatar pink">MC</span></div><div class="webbody">${state.availability==='Live'?session():empty()}${aside()}</div>`;else $('#frame').innerHTML=chrome()+`<div class="body">${sidebar(state.screen==='app')}${state.preview?`<main class="main"><div class="previewnotice">Guest preview · ${state.role} access · ${state.history} <button data-action="end-preview">← Back to sharing</button></div><div class="conversation">${transcript()}</div><div class="readonly" style="margin-bottom:25px">No local files or other sessions are accessible</div></main>`:session(state.screen==='share')}</div>`+(state.screen==='share'&&!state.preview&&!state.closed?modal():'');}
document.addEventListener('change',e=>{if(e.target.dataset.setting){state[e.target.dataset.setting]=e.target.value;render()}});
document.addEventListener('click',async e=>{const b=e.target.closest('button,[data-action]');if(!b)return;if(b.dataset.screen){state.screen=b.dataset.screen;state.preview=false;state.closed=false;render();return}if(b.dataset.role){state.role=b.dataset.role;state.created=false;render();return}switch(b.dataset.action){case'close-share':state.closed=true;render();break;case'open-share':state.closed=false;render();break;case'preview':state.preview=true;render();break;case'end-preview':state.preview=false;render();break;case'create':if(!state.created){state.created=true;render();toast('Prototype only: no real session was shared.')}else{try{await navigator.clipboard.writeText('https://share.sheprd.example/s/7k9m#demo-invite');toast('Demo link copied. This address is intentionally nonfunctional.')}catch{toast('Select the demo link above to copy it.')}}break;case'revoke':state.created=false;render();toast('Demo invitation revoked. Future access would stop.');break;case'native':state.screen='app';render();toast('Preview: the same session is now open in Sheprd.');break;case'request':toast('Demo request sent to François. Your access is still view-only.');break;case'access':toast('One session · '+state.webrole+' · Expires in 58 minutes · No fleet access');break;case'guest-send':{const input=$('#guest-text');if(!input.value.trim())return;if(state.webrole==='Commenter'){state.comments.push(input.value.trim());render();$('.conversation').scrollTop=$('.conversation').scrollHeight}else{input.value='';toast('Suggested prompt is pending owner approval. Nothing ran.')}break}case'owner-send':toast('Prototype only: no prompt was sent.');break;case'live':state.availability='Live';render();break}});
render();
</script></body></html>
